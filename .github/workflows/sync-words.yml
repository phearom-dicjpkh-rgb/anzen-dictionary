name: Sync words from Google Sheets

# Runs by itself every hour (at :15, so it never races the exercise sync at :30),
# so editing the words Sheet is enough — nothing to press. The Sheet is the
# master source now and can carry an image link per word. Still available
# manually from the Actions tab. It only commits when the sheet actually
# differs, so idle runs cost nothing.
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write      # commit the refreshed word data
  actions: write       # kick off the Pages deploy afterwards

concurrency:
  group: sync-words
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch the sheet and rebuild word data
        id: sync
        env:
          # optional: a repo variable to point at a different sheet document
          WORDS_CSV_URL: ${{ vars.WORDS_CSV_URL }}
        run: node tools/sync-words-sheet.js

      - name: Commit changes
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html data/words.csv
          git commit -m "Sync words from Google Sheets (${{ steps.sync.outputs.count }} entries)"
          git pull --rebase origin main
          git push

      - name: Deploy the updated site
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml

      - name: Nothing to do
        if: steps.sync.outputs.changed != 'true'
        run: echo "The sheet matches what is already published — no deploy needed."
